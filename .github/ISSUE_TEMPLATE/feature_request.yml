name: Feature or task
description: A proposed improvement, with acceptance criteria
body:
  - type: textarea
    id: problem
    attributes: {label: Problem}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: How we will know it is done (tests, measurements).}
    validations: {required: true}
